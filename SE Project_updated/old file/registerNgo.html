<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareQueue - Register NGO</title>
    <link rel="icon" type="image/x-icon" href="./Images/icon1.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        // Custom Tailwind configuration to use the same color palette
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#2a9d8f',   // Original Teal
                        'primary-dark': '#248a7d',
                        'secondary': '#e9c46a', // Original Gold
                        'secondary-dark': '#d8b45a',
                        'light-bg': '#e8f5e9',   // Light green background
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-light-bg flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 md:p-10 rounded-xl shadow-lg w-full max-w-lg mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-primary mb-2">CareQueue</h1>
            <p class="text-gray-600">Register Your NGO</p>
        </div>

        <form>
            <div class="mb-4">
                <label for="ngo_name" class="block text-gray-700 text-sm font-semibold mb-2">NGO Name</label>
                <input type="text" id="ngo_name" name="ngo_name"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="e.g., Hope Foundation" required>
            </div>
            <div class="mb-4">
                <label for="ngo_email" class="block text-gray-700 text-sm font-semibold mb-2">NGO Email Address</label>
                <input type="email" id="ngo_email" name="ngo_email"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="contact@ngoname.org" required>
            </div>
            <div class="mb-4">
                <label for="contact_person" class="block text-gray-700 text-sm font-semibold mb-2">Contact Person Full Name</label>
                <input type="text" id="contact_person" name="contact_person"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="e.g., Jane Doe, Director" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Set Password</label>
                <input type="password" id="password" name="password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="••••••••" required>
            </div>
            <div class="mb-6">
                <label for="confirm_password" class="block text-gray-700 text-sm font-semibold mb-2">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="••••••••" required>
            </div>
            
            <button type="submit"
                    class="w-full bg-primary text-white font-bold py-3 px-4 rounded-md shadow-md hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-300">
                Register NGO
            </button>
        </form>

        <p class="text-center text-gray-600 text-sm mt-6">
            Already registered? 
            <a href="ngoAdminLogin.html" class="text-primary hover:text-primary-dark font-semibold transition-colors">Login here</a>
        </p>
        <p class="text-center text-gray-600 text-sm mt-3">
            Are you a donor?
            <a href="login.html" class="text-primary hover:text-primary-dark font-semibold transition-colors">Log in as donor</a>
        </p>
    </div>

</body>
</html>
